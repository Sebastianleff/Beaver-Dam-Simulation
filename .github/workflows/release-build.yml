name: Release Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
            artifact: BeaverDamSimulation_Mac
          - os: windows-latest
            python: "3.11"
            artifact: BeaverDamSimulation_Win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Debug environment
        run: |
          python -V
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller spec
        run: |
          pyinstaller --clean --noconfirm console.spec

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -la dist
          ditto -c -k --sequesterRsrc --keepParent dist "${{ matrix.artifact }}.zip"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
